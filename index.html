<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark" />
    <title>X Ripper — video and GIF downloader</title>
    <meta
      name="description"
      content="Paste a public X post and download the video or GIF."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2311160c'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23d6ff4a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@380;500;640&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <a class="brand" href="./">
          <span class="lamp" aria-hidden="true"></span>
          X Ripper
        </a>
        <p class="eyebrow">Public posts on X</p>
      </header>

      <main>
        <section class="hero">
          <h1>Get the file.</h1>
          <p class="lede">
            Paste a link from X. X Ripper finds the video or GIF and gives you a download.
          </p>
        </section>

        <form id="form" class="deck" autocomplete="off">
          <label class="field-label" for="url">Post link</label>
          <div class="entry">
            <input
              id="url"
              name="url"
              type="text"
              inputmode="url"
              spellcheck="false"
              placeholder="https://x.com/someone/status/…"
              required
            />
            <button id="submit" type="submit">Rip</button>
          </div>
          <button id="example" class="example" type="button">
            Try a public example
          </button>
        </form>

        <p id="status" class="status" role="status" hidden></p>
        <section id="result" class="result" hidden></section>
      </main>

      <footer>
        <p>
          Works on public posts. GIFs on X are stored as MP4, so they download as
          MP4 and still loop.
        </p>
      </footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
